<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Same-Origin Iframe</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; background: #f0f4ff; }
    .card { background: white; padding: 1rem; border-radius: 8px; border: 1px solid #c5d0f0; }
    button { margin: 0.25rem; padding: 0.5rem 1rem; cursor: pointer; }
    input, textarea { display: block; width: 100%; margin: 0.5rem 0; padding: 0.5rem; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="card" data-testid="iframe-card">
    <h2 id="iframe-heading">Same-Origin Iframe Content</h2>
    <p id="iframe-description">This page is served from <code>/iframe-same-origin.html</code></p>

    <form id="iframe-form" data-testid="iframe-form">
      <label for="iframe-input">Iframe text input</label>
      <input type="text" id="iframe-input" name="iframeInput" placeholder="Type inside iframe" data-testid="iframe-input" />

      <label for="iframe-textarea">Iframe textarea</label>
      <textarea id="iframe-textarea" name="iframeTextarea" rows="3" data-testid="iframe-textarea">Default iframe text</textarea>

      <button type="button" id="iframe-btn-primary" data-testid="iframe-btn-primary">Iframe Button</button>
      <button type="submit" id="iframe-btn-submit" data-testid="iframe-btn-submit">Submit</button>
    </form>

    <iframe
      id="nested-iframe"
      title="Nested iframe"
      data-testid="nested-iframe"
      src="/iframe-nested.html"
      width="100%"
      height="120"
      style="border: 2px dashed #94a3b8; margin-top: 1rem;"
    ></iframe>
  </div>
  <script>
    document.getElementById('iframe-btn-primary').addEventListener('click', () => {
      document.getElementById('iframe-description').textContent = 'Button clicked at ' + new Date().toLocaleTimeString();
    });
    document.getElementById('iframe-form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Iframe form submitted');
    });
  </script>
</body>
</html>
